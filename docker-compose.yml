services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: akarsh
      POSTGRES_PASSWORD: akarsh444
      POSTGRES_DB: stocksync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akarsh -d stocksync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://akarsh:akarsh444@postgres:5432/stocksync
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_key_change_this
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akarsh
          POSTGRES_PASSWORD: akarsh444
          POSTGRES_DB: stocksync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akarsh -d stocksync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://akarsh:akarsh444@localhost:5432/stocksync
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_key
      NODE_ENV: test
      PORT: 3000
      ADMIN_SIGNUP_SECRET: ci_admin_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

      - name: Start server in background
        run: nohup npm start > server.log 2>&1 &

      - name: Wait for server to be ready
        run: npx wait-on http-get://localhost:3000/health -t 60000

      - name: Show server logs
        if: always()
        run: cat server.log || echo "No server log found"

      - name: Run smoke tests
        run: npm run smoke
